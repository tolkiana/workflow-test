name: Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  detect-changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4

      - name: detect changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'

      - name: decide whether to run
        id: decide
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" || "${{ steps.filter.outputs.code }}" == "true" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  # Simulates all the test jobs (core-test, monolith-test, etc.)
  test-job-1:
    name: test-job-1
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.should_run == 'true'
    steps:
      - run: echo "Running tests..."

  test-job-2:
    name: test-job-2
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.should_run == 'true'
    steps:
      - run: echo "Running more tests..."

  sonarqube:
    name: sonarqube
    runs-on: ubuntu-latest
    needs: [detect-changes, test-job-1, test-job-2]
    timeout-minutes: 5
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    steps:
      - run: echo "SonarQube analysis would run here"
      - run: |
          echo "detect-changes result: ${{ needs.detect-changes.result }}"
          echo "test-job-1 result: ${{ needs.test-job-1.result }}"
          echo "test-job-2 result: ${{ needs.test-job-2.result }}"
          echo "should_run: ${{ needs.detect-changes.outputs.should_run }}"
